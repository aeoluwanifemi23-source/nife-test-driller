<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Nife's Test Driller — CBT Practice Terminal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>:root{
  --bg: #181229;
  --bg-panel: #1f1836;
  --bg-panel-raised: #271e42;
  --bg-card: #1c1530;
  --line: #382a56;
  --line-soft: #251c3f;
  --ink: #f5f1ff;
  --ink-dim: #b9aed8;
  --ink-faint: #7c6fa0;

  /* Core accents — each function gets its own hue, not just one-color-everywhere */
  --green: #ff6b4a;
  --green-dim: #a83f28;
  --green-glow: rgba(255,107,74,0.24);

  --amber: #ffd23f;
  --amber-dim: #9c7d16;
  --amber-glow: rgba(255,210,63,0.22);

  --red: #ff5d7a;
  --red-dim: #892c42;
  --red-glow: rgba(255,93,122,0.20);

  --blue: #4ecdc4;
  --blue-dim: #1d6e67;
  --blue-glow: rgba(78,205,196,0.20);

  --violet: #b389ff;
  --violet-dim: #5b3f96;
  --violet-glow: rgba(179,137,255,0.18);

  --pink: #ff8fc9;
  --pink-dim: #8a3f68;
  --pink-glow: rgba(255,143,201,0.16);

  --mono: 'IBM Plex Mono', monospace;
  --sans: 'Plus Jakarta Sans', sans-serif;
  --display: 'Fredoka', sans-serif;
  --radius: 10px;
  --radius-sm: 7px;
  --radius-lg: 18px;
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{height:100%;}
html{ -webkit-tap-highlight-color: transparent; }
body{
  background: var(--bg);
  color: var(--ink);
  font-family: var(--sans);
  -webkit-font-smoothing: antialiased;
  min-height:100vh;
  background-image:
    radial-gradient(ellipse 1100px 650px at 12% -8%, rgba(255,107,74,0.13), transparent 60%),
    radial-gradient(ellipse 950px 600px at 105% 5%, rgba(255,210,63,0.09), transparent 55%),
    radial-gradient(ellipse 900px 550px at 50% 105%, rgba(78,205,196,0.08), transparent 60%);
  background-attachment: fixed;
}
#root{min-height:100vh; display:flex; flex-direction:column;}
::selection{ background: var(--green-glow); color:var(--ink); }

@media (prefers-reduced-motion: reduce){
  *, *::before, *::after{ animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
}

/* scrollbar */
::-webkit-scrollbar{ width:8px; height:8px; }
::-webkit-scrollbar-track{ background: var(--bg-panel); }
::-webkit-scrollbar-thumb{ background: var(--line); border-radius: 4px; }
::-webkit-scrollbar-thumb:hover{ background: var(--ink-faint); }

button{ font-family: var(--sans); cursor:pointer; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
button:focus-visible, [tabindex]:focus-visible, input:focus-visible, select:focus-visible{
  outline: 2px solid var(--green);
  outline-offset: 2px;
}

/* ============ TOP STATUS BAR ============ */
.statusbar{
  display:flex; align-items:center; justify-content:space-between;
  padding: 10px 20px;
  background: var(--bg-panel);
  border-bottom: 1px solid var(--line);
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.06em;
  color: var(--ink-faint);
  flex-shrink:0;
  position: sticky; top:0; z-index:40;
  backdrop-filter: blur(8px);
}
.statusbar .sb-left{ display:flex; align-items:center; gap:10px; min-width:0; }
.statusbar .dot{ width:7px; height:7px; border-radius:50%; background: var(--green); box-shadow: 0 0 8px var(--green); flex-shrink:0; animation: pulse 2.2s ease-in-out infinite; }
@keyframes pulse{ 0%,100%{opacity:1;} 50%{opacity:0.4;} }
.statusbar .sb-right{ display:flex; align-items:center; gap:16px; }
.statusbar b{ color: var(--ink-dim); font-weight:600; }

/* ============ LAYOUT WRAPPERS ============ */
.screen{ flex:1; display:flex; flex-direction:column; }
.wrap{ max-width: 880px; margin:0 auto; width:100%; padding: 40px 20px 60px; }
.wrap.wide{ max-width: 1080px; }

/* ============ HOME / DASHBOARD ============ */
.hero{
  padding: 64px 20px 44px;
  text-align:center;
  position:relative;
  border-bottom:1px solid var(--line);
  overflow: hidden;
}
.hero::before{
  content:'';
  position:absolute; top:-140px; left:50%; transform:translateX(-50%);
  width:640px; height:360px;
  background: radial-gradient(ellipse at center, rgba(255,107,74,0.22), transparent 68%);
  pointer-events:none;
}
.hero-eyebrow{
  font-family: var(--display);
  font-weight:600;
  font-size:13px;
  letter-spacing:0.04em;
  color: var(--bg);
  text-transform:uppercase;
  margin-bottom:22px;
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  background: linear-gradient(135deg, var(--amber), var(--green));
  padding: 8px 18px 8px 14px;
  border-radius: 999px;
  transform: rotate(-2deg);
  box-shadow: 0 6px 20px rgba(255,107,74,0.25);
  position:relative;
}
.hero-eyebrow::before, .hero-eyebrow::after{ content:none; }
.hero h1{
  font-family: var(--display);
  font-size: clamp(34px, 6vw, 58px);
  font-weight:600;
  letter-spacing:-0.01em;
  line-height:1.08;
  margin-bottom:14px;
}
.hero h1 span{
  background: linear-gradient(120deg, var(--green), var(--amber));
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}
.hero p{ color: var(--ink-dim); font-size:15.5px; max-width:520px; margin:0 auto; line-height:1.6; }

.dash-stats{
  display:grid; grid-template-columns:repeat(4,1fr); gap:1px;
  background: var(--line);
  border:1px solid var(--line);
  margin: 32px auto 0; max-width:820px;
  border-radius: var(--radius-lg);
  overflow:hidden;
  box-shadow: 0 12px 30px rgba(0,0,0,0.25);
}
.dash-stat{ background: var(--bg-panel); padding:22px 14px; text-align:center; transition: background .15s, transform .15s; position:relative; overflow:hidden; }
.dash-stat::before{ content:''; position:absolute; top:0; left:0; width:100%; height:3px; background: var(--stat-color, var(--green)); opacity:0.85; }
.dash-stat:hover{ background: var(--bg-panel-raised); transform: translateY(-2px); }
.dash-stat .num{ font-family:var(--display); font-size:30px; font-weight:600; line-height:1; }
.dash-stat:nth-child(1) .num{ color: var(--green); }
.dash-stat:nth-child(2) .num{ color: var(--blue); }
.dash-stat:nth-child(3) .num{ color: var(--violet); }
.dash-stat:nth-child(4) .num{ color: var(--amber); }
.dash-stat:nth-child(1)::before{ background: var(--green); }
.dash-stat:nth-child(2)::before{ background: var(--blue); }
.dash-stat:nth-child(3)::before{ background: var(--violet); }
.dash-stat:nth-child(4)::before{ background: var(--amber); }
.dash-stat .lbl{ font-size:10.5px; color:var(--ink-faint); text-transform:uppercase; letter-spacing:0.08em; margin-top:6px; font-weight:600; }

.dash-actions{ display:flex; gap:14px; justify-content:center; margin-top:36px; flex-wrap:wrap; }
.btn{
  font-family: var(--sans);
  font-weight:700;
  font-size:14px;
  padding: 13px 26px;
  border-radius: 999px;
  border:1px solid var(--line);
  background: var(--bg-panel-raised);
  color: var(--ink);
  transition: all .15s ease;
  display:inline-flex; align-items:center; gap:8px;
  min-height:44px;
}
.btn:hover{ border-color: var(--ink-faint); background:#2e2350; transform: translateY(-1px); }
.btn:active{ transform: translateY(0); }
.btn.primary{ background: linear-gradient(135deg, var(--green), #ff8a5c); color:#1c0f08; border-color: transparent; font-weight:800; }
.btn.primary:hover{ box-shadow: 0 6px 26px var(--green-glow); transform: translateY(-1px); filter: brightness(1.06); }
.btn.ghost{ background:transparent; }
.btn.danger{ border-color: var(--red-dim); color: var(--red); background:transparent; }
.btn.danger:hover{ background: rgba(255,93,122,0.1); border-color: var(--red); }
.btn:disabled{ opacity:0.35; cursor:not-allowed; transform:none !important; box-shadow:none !important; }
.btn.small{ padding:9px 14px; font-size:12.5px; min-height:38px; }
.btn.full{ width:100%; justify-content:center; }

.section-block{ padding: 44px 20px; border-bottom:1px solid var(--line-soft); }
.section-title{
  font-family: var(--display); font-size:16px; font-weight:600; letter-spacing:0; text-transform:none;
  color: var(--ink); margin-bottom:20px; display:flex; align-items:center; gap:10px;
}
.section-title .n{ color: var(--green); font-size:18px; }

.topic-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:12px; }
.topic-card{
  background: var(--bg-panel); border:1px solid var(--line); border-radius:var(--radius-lg);
  padding:16px 18px; transition: all .15s; position:relative; overflow:hidden;
}
.topic-card::before{
  content:''; position:absolute; top:0; left:0; width:4px; height:100%;
  background: var(--topic-color, var(--green)); opacity:0.9;
}
.topic-card:hover{ border-color: var(--ink-faint); transform: translateY(-2px); box-shadow: 0 10px 24px rgba(0,0,0,0.2); }
.topic-card .tname{ font-size:13.5px; font-weight:700; margin-bottom:10px; line-height:1.3; padding-left:6px; }
.topic-bar-track{ height:6px; background:var(--line-soft); border-radius:999px; overflow:hidden; margin-bottom:8px;}
.topic-bar-fill{ height:100%; border-radius:999px; transition: width .3s ease; }
.topic-meta{ display:flex; justify-content:space-between; font-family:var(--mono); font-size:10.5px; color:var(--ink-faint); }

/* ============ SETTINGS SCREEN ============ */
.settings-card{
  background: var(--bg-panel);
  border:1px solid var(--line);
  border-radius: var(--radius);
  padding: 28px;
  margin-bottom:18px;
}
.settings-card h3{
  font-family: var(--mono); font-size:11px; text-transform:uppercase; letter-spacing:0.1em;
  color: var(--green); margin-bottom:18px; padding-bottom:12px; border-bottom:1px solid var(--line-soft);
}
.opt-row{ margin-bottom: 20px; }
.opt-row:last-child{ margin-bottom:0; }
.opt-label{ font-size:13px; font-weight:600; margin-bottom:10px; color:var(--ink); display:flex; justify-content:space-between; align-items:center;}
.opt-label .hint{ font-weight:400; color:var(--ink-faint); font-size:11.5px; }
.chip-row{ display:flex; gap:8px; flex-wrap:wrap; }
.chip{
  padding: 10px 16px; border-radius: 20px; border:1px solid var(--line);
  background: var(--bg-card); color: var(--ink-dim); font-size:12.5px; font-weight:600;
  transition: all .12s; min-height:38px; display:inline-flex; align-items:center;
}
.chip:hover{ border-color: var(--ink-faint); color:var(--ink); }
.chip.active{ background: var(--green); color:#1c0f08; border-color:var(--green); box-shadow: 0 2px 12px var(--green-glow); }
.chip.active.amber{ background: var(--amber); border-color:var(--amber); color:#1a1200; box-shadow: 0 2px 12px var(--amber-glow); }
.num-input{
  background: var(--bg-card); border:1px solid var(--line); color:var(--ink);
  font-family:var(--mono); font-size:14px; padding:10px 12px; border-radius:var(--radius); width:100px;
  min-height:40px;
}
.toggle-row{ display:flex; align-items:center; justify-content:space-between; padding:14px 0; border-bottom:1px solid var(--line-soft); gap:16px; }
.toggle-row:last-child{ border-bottom:none; }
.toggle-label{ font-size:13px; font-weight:500; }
.toggle-label .sub{ display:block; font-size:11.5px; color:var(--ink-faint); font-weight:400; margin-top:2px; }
.switch{ position:relative; width:44px; height:25px; background:var(--line); border-radius:13px; border:1px solid var(--line); flex-shrink:0; transition: background .15s; }
.switch.on{ background: var(--green-dim); border-color: var(--green); }
.switch .knob{ position:absolute; top:2px; left:2px; width:19px; height:19px; border-radius:50%; background:var(--ink-faint); transition: all .15s; }
.switch.on .knob{ left:21px; background: var(--green); box-shadow: 0 0 8px var(--green-glow); }

.mode-card{
  border:1px solid var(--line); border-radius:var(--radius); padding:18px; cursor:pointer;
  background: var(--bg-card); transition: all .15s; flex:1; position:relative;
}
.mode-card:hover{ border-color: var(--ink-faint); transform: translateY(-1px); }
.mode-card.active{ border-color: var(--green); background: rgba(255,107,74,0.08); box-shadow: 0 0 0 1px var(--green), 0 4px 20px var(--green-glow); }
.mode-card.active.exam-variant{ border-color: var(--red); background: rgba(255,93,122,0.08); box-shadow: 0 0 0 1px var(--red), 0 4px 20px var(--red-glow); }
.mode-card .mtitle{ font-weight:700; font-size:14.5px; margin-bottom:6px; display:flex; align-items:center; gap:8px;}
.mode-card .mdesc{ font-size:12px; color:var(--ink-faint); line-height:1.5; }
.mode-grid{ display:flex; gap:12px; }

/* ============ EXAM SCREEN ============ */
.exam-shell{ flex:1; display:flex; flex-direction:column; }
.exam-topbar{
  display:flex; align-items:center; justify-content:space-between;
  padding: 12px 20px; background: var(--bg-panel); border-bottom:1px solid var(--line);
  flex-wrap:wrap; gap:10px; position: sticky; top:0; z-index: 30;
}
.timer-box{
  font-family: var(--mono); font-size:20px; font-weight:600; letter-spacing:0.03em;
  padding: 7px 16px; border-radius:var(--radius); border:1px solid var(--line);
  background: var(--bg-card); color: var(--green); display:flex; align-items:center; gap:8px;
  min-width:110px; justify-content:center;
}
.timer-box.warn{ color: var(--amber); border-color: var(--amber-dim); background: rgba(255,176,32,0.06); }
.timer-box.crit{ color: var(--red); border-color: var(--red-dim); background: rgba(255,93,122,0.08); animation: blink 1s step-start infinite; }
@keyframes blink{ 50%{ opacity:0.55; } }
.progress-strip{ height:3px; background: var(--line-soft); width:100%; position:sticky; top:0; z-index:41; }
.progress-strip-fill{ height:100%; background: linear-gradient(90deg, var(--blue), var(--green)); transition: width .25s ease; }

.exam-body{ flex:1; display:flex; gap:0; min-height:0; }
.qnav-panel{
  width: 260px; flex-shrink:0; background: var(--bg-panel);
  border-right:1px solid var(--line); padding:18px; overflow-y:auto;
  display:flex; flex-direction:column;
}
.qnav-legend{ display:flex; flex-direction:column; gap:7px; margin-bottom:16px; font-size:11px; color:var(--ink-faint); }
.qnav-legend .lg-item{ display:flex; align-items:center; gap:8px; }
.lg-swatch{ width:11px; height:11px; border-radius:3px; flex-shrink:0; }
.qnav-grid{ display:grid; grid-template-columns:repeat(5,1fr); gap:6px; }
.qnav-btn{
  aspect-ratio:1; border-radius:5px; border:1px solid var(--line);
  background: var(--bg-card); color:var(--ink-faint); font-family:var(--mono); font-size:11px;
  display:flex; align-items:center; justify-content:center; transition: all .1s;
  min-height:32px;
}
.qnav-btn:hover{ border-color: var(--ink-faint); }
.qnav-btn.answered{ background: rgba(255,107,74,0.16); border-color: var(--green-dim); color: var(--green); }
.qnav-btn.flagged{ box-shadow: inset 0 0 0 1.5px var(--amber); }
.qnav-btn.current{ border-color: var(--blue); box-shadow: 0 0 0 1.5px var(--blue), 0 0 10px var(--blue-glow); color: var(--ink); }

.exam-main{ flex:1; display:flex; flex-direction:column; min-width:0; }
.qarea{ flex:1; padding: 32px 40px; max-width:760px; }
.qmeta-row{ display:flex; align-items:center; gap:10px; margin-bottom:18px; flex-wrap:wrap; }
.qcounter{ font-family:var(--mono); font-size:12.5px; color:var(--ink-faint); }
.tag{ font-family:var(--mono); font-size:10px; text-transform:uppercase; letter-spacing:0.06em; padding:4px 10px; border-radius:10px; border:1px solid var(--line); color:var(--ink-faint); white-space:nowrap; }
.tag.topic{ color: var(--blue); border-color: rgba(78,205,196,0.35); background: rgba(78,205,196,0.06); }
.tag.diff-easy{ color: var(--green); border-color: var(--green-dim); background: rgba(255,107,74,0.06); }
.tag.diff-medium{ color: var(--amber); border-color: var(--amber-dim); background: rgba(255,176,32,0.06); }
.tag.diff-hard{ color: var(--red); border-color: var(--red-dim); background: rgba(255,93,122,0.06); }
.flag-btn{ margin-left:auto; font-family:var(--mono); font-size:11px; color:var(--ink-faint); border:1px solid var(--line); padding:7px 12px; border-radius:14px; background:transparent; display:flex; align-items:center; gap:6px; min-height:34px;}
.flag-btn.on{ color: var(--amber); border-color: var(--amber-dim); background: rgba(255,176,32,0.1); }

.qtext{ font-size: 19px; line-height:1.55; font-weight:500; color:var(--ink); margin-bottom:28px; }
.options-list{ display:flex; flex-direction:column; gap:10px; }
.option{
  display:flex; align-items:flex-start; gap:14px; padding:16px 18px;
  border:1px solid var(--line); border-radius:var(--radius); background: var(--bg-panel);
  transition: all .12s; text-align:left; min-height:52px; width:100%;
}
.option:hover:not(.locked){ border-color: var(--blue-dim); background: var(--bg-panel-raised); transform: translateX(2px); }
.option.selected{ border-color: var(--blue); background: var(--blue-glow); box-shadow: 0 0 0 1px var(--blue); }
.option-letter{
  font-family: var(--mono); font-weight:700; font-size:13px; width:28px; height:28px; border-radius:6px;
  border:1px solid var(--line); display:flex; align-items:center; justify-content:center; flex-shrink:0;
  color: var(--ink-faint);
}
.option.selected .option-letter{ background: var(--blue); color:#0d1a24; border-color:var(--blue); }
.option-text{ font-size:14.5px; line-height:1.5; padding-top:3px; }

.option.correct{ border-color: var(--green); background: var(--green-glow); box-shadow: 0 0 0 1px var(--green); }
.option.correct .option-letter{ background: var(--green); color:#1c0f08; border-color:var(--green); }
.option.incorrect{ border-color: var(--red); background: var(--red-glow); box-shadow: 0 0 0 1px var(--red); }
.option.incorrect .option-letter{ background: var(--red); color:#2b0812; border-color:var(--red); }

.explain-box{
  margin-top:20px; padding:16px 18px; border-radius:var(--radius); border:1px solid var(--line);
  background: var(--bg-card); font-size:13.5px; line-height:1.6; color: var(--ink-dim);
  animation: slideIn .2s ease;
}
@keyframes slideIn{ from{ opacity:0; transform: translateY(-6px);} to{ opacity:1; transform: translateY(0);} }
.explain-box .exlabel{ font-family:var(--mono); font-size:10.5px; text-transform:uppercase; letter-spacing:0.08em; color: var(--green); margin-bottom:8px; }

.exam-footer{
  padding:16px 40px; border-top:1px solid var(--line); background: var(--bg-panel);
  display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap;
  position: sticky; bottom:0;
}
.footer-right{ display:flex; gap:10px; }

/* ============ MOBILE QUESTION NAV (bottom sheet trigger) ============ */
.mobile-qnav-toggle{ display:none; }
.mobile-qnav-sheet{ display:none; }

/* ============ RESULTS SCREEN ============ */
.score-hero{
  text-align:center; padding: 50px 20px 36px; border-bottom:1px solid var(--line);
  background: linear-gradient(180deg, rgba(255,107,74,0.05), transparent 70%);
}
.grade-badge{
  display:inline-flex; align-items:center; justify-content:center;
  width:120px; height:120px; border-radius:50%; margin-bottom:20px;
  border:2px solid var(--green); font-family:var(--display); font-size:44px; font-weight:700;
  color: var(--green); background: var(--bg-card); position:relative;
  box-shadow: 0 0 40px var(--green-glow);
  animation: popIn .4s cubic-bezier(.34,1.56,.64,1);
}
@keyframes popIn{ from{ opacity:0; transform: scale(0.7);} to{ opacity:1; transform: scale(1);} }
.score-big{ font-family:var(--mono); font-size:40px; font-weight:600; margin-bottom:6px; }
.score-sub{ color: var(--ink-dim); font-size:14px; }

.stat-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:1px; background:var(--line); border:1px solid var(--line); margin-top:28px; border-radius:var(--radius); overflow:hidden;}
.stat-cell{ background: var(--bg-panel); padding:18px; text-align:center; }
.stat-cell .v{ font-family:var(--mono); font-size:22px; font-weight:600; }
.stat-cell .k{ font-size:10.5px; color:var(--ink-faint); text-transform:uppercase; letter-spacing:0.06em; margin-top:4px;}
.stat-cell.correct .v{ color: var(--green); }
.stat-cell.wrong .v{ color: var(--red); }
.stat-cell.unans .v{ color: var(--ink-faint); }

.perf-topic-row{ display:flex; align-items:center; gap:14px; padding:12px 0; border-bottom:1px solid var(--line-soft); }
.perf-topic-row .pname{ width:230px; flex-shrink:0; font-size:13px; font-weight:500; }
.perf-topic-row .ptrack{ flex:1; height:8px; background:var(--line-soft); border-radius:4px; overflow:hidden; }
.perf-topic-row .pfill{ height:100%; border-radius:4px; transition: width .5s ease; }
.perf-topic-row .ppct{ font-family:var(--mono); font-size:12.5px; width:44px; text-align:right; flex-shrink:0; }

.weak-card{ border:1px solid var(--amber-dim); background: rgba(255,176,32,0.07); border-radius:var(--radius); padding:16px 18px; margin-bottom:10px; }
.weak-card .wtitle{ font-weight:700; font-size:13.5px; color: var(--amber); margin-bottom:4px; }
.weak-card .wdesc{ font-size:12.5px; color: var(--ink-dim); line-height:1.5; }

/* ============ REVIEW LIST ============ */
.review-item{ border:1px solid var(--line); border-radius:var(--radius); background:var(--bg-panel); padding:20px 22px; margin-bottom:12px; }
.review-item.correct{ border-left:3px solid var(--green); }
.review-item.incorrect{ border-left:3px solid var(--red); }
.review-item.unanswered{ border-left:3px solid var(--ink-faint); }
.review-q{ font-size:14.5px; font-weight:500; margin-bottom:12px; line-height:1.5; }
.review-ans-row{ font-size:12.5px; margin-bottom:4px; font-family:var(--mono); }
.review-ans-row .lbl{ color:var(--ink-faint); display:inline-block; width:110px; }
.review-ans-row.your-wrong{ color: var(--red); }
.review-ans-row.your-right{ color: var(--green); }
.review-explain{ margin-top:10px; font-size:12.5px; color:var(--ink-dim); line-height:1.6; padding-top:10px; border-top:1px solid var(--line-soft); }

/* filters */
.filter-bar{ display:flex; gap:8px; margin-bottom:20px; flex-wrap:wrap; }

/* ============ MODAL ============ */
.modal-backdrop{ position:fixed; inset:0; background:rgba(5,10,7,0.75); backdrop-filter: blur(3px); display:flex; align-items:center; justify-content:center; z-index:100; padding:20px; animation: fadeIn .15s ease; }
@keyframes fadeIn{ from{opacity:0;} to{opacity:1;} }
.modal-box{ background: var(--bg-panel-raised); border:1px solid var(--line); border-radius:10px; padding:28px; max-width:420px; width:100%; animation: popIn .2s cubic-bezier(.34,1.56,.64,1); }
.modal-box h3{ font-family:var(--display); font-size:19px; margin-bottom:10px; }
.modal-box p{ font-size:13.5px; color: var(--ink-dim); line-height:1.6; margin-bottom:22px; }
.modal-actions{ display:flex; gap:10px; justify-content:flex-end; }

/* misc */
.empty-note{ text-align:center; padding:60px 20px; color: var(--ink-faint); font-size:13.5px; }
.flag-note{ font-size:11.5px; color:var(--amber); background: rgba(255,176,32,0.08); border:1px solid var(--amber-dim); padding:10px 12px; border-radius:var(--radius); margin-top:14px; }

/* ============ RESPONSIVE BREAKPOINTS ============ */

/* Tablet */
@media (max-width: 1024px){
  .qnav-panel{ width: 220px; padding: 14px; }
  .qarea{ padding: 28px 30px; }
  .exam-footer{ padding: 14px 30px; }
}

@media (max-width: 860px){
  .qnav-panel{ display:none; }
  .qarea{ padding:20px 18px 100px; }
  .exam-footer{ padding:12px 16px; }

  .mode-grid{ flex-direction:column; }

  .mobile-qnav-toggle{
    display:flex; position:fixed; bottom:78px; right:16px; z-index:50;
    width:52px; height:52px; border-radius:50%; align-items:center; justify-content:center;
    background: var(--blue); color:#0d1a24; border:none; font-family:var(--mono); font-weight:700; font-size:13px;
    box-shadow: 0 4px 20px rgba(78,205,196,0.4);
  }
  .mobile-qnav-sheet{
    display:block; position:fixed; inset:0; z-index:60; background: rgba(5,10,7,0.7);
  }
  .mobile-qnav-sheet .sheet-inner{
    position:absolute; bottom:0; left:0; right:0; max-height:75vh; overflow-y:auto;
    background: var(--bg-panel-raised); border-top:1px solid var(--line); border-radius: 16px 16px 0 0;
    padding: 20px; animation: sheetUp .2s ease;
  }
  @keyframes sheetUp{ from{ transform: translateY(100%);} to{ transform: translateY(0);} }
  .sheet-handle{ width:36px; height:4px; background:var(--line); border-radius:2px; margin:0 auto 16px; }
  .qnav-grid.mobile{ grid-template-columns:repeat(6,1fr); }
}

/* Mobile portrait */
@media (max-width: 600px){
  .hero{ padding: 40px 16px 32px; }
  .hero h1{ font-size: clamp(28px, 8vw, 38px); }
  .hero p{ font-size:14px; }
  .dash-stats{ grid-template-columns:repeat(2,1fr); margin-top:24px; }
  .dash-actions{ flex-direction:column; width:100%; }
  .dash-actions .btn{ width:100%; }
  .section-block{ padding:28px 16px; }
  .topic-grid{ grid-template-columns:1fr; }

  .wrap{ padding: 24px 16px 48px; }
  .settings-card{ padding:20px 16px; }

  .statusbar{ padding: 8px 14px; font-size:10px; }
  .statusbar .sb-right span:first-child{ display:none; }

  .exam-topbar{ padding: 10px 14px; }
  .timer-box{ font-size:16px; padding:6px 12px; min-width:90px; }

  .qarea{ padding: 16px 14px 110px; }
  .qtext{ font-size:16.5px; margin-bottom:20px; }
  .qmeta-row{ gap:6px; }
  .tag{ font-size:9px; padding:3px 8px; }
  .flag-btn{ font-size:10px; padding:6px 10px; }
  .option{ padding:13px 14px; gap:11px; }
  .option-text{ font-size:13.5px; }

  .exam-footer{ padding:10px 12px; }
  .exam-footer .btn{ flex:1; padding:12px 14px; font-size:13px; }
  .footer-right{ flex:1; }
  .footer-right .btn{ width:100%; }

  .score-hero{ padding:36px 16px 28px; }
  .grade-badge{ width:96px; height:96px; font-size:36px; }
  .score-big{ font-size:32px; }
  .stat-grid{ grid-template-columns:repeat(2,1fr); }
  .perf-topic-row{ flex-wrap:wrap; }
  .perf-topic-row .pname{ width:100%; }

  .review-item{ padding:16px; }
  .modal-box{ padding:22px; }

  .mobile-qnav-toggle{ bottom:70px; }
}

/* Very small phones */
@media (max-width: 380px){
  .dash-stats{ grid-template-columns:1fr 1fr; }
  .stat-grid{ grid-template-columns:1fr 1fr; }
  .grade-badge{ width:84px; height:84px; font-size:30px; }
}
